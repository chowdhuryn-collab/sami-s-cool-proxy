
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID GAMES</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111522;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252c40;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  color: #8b5cf6;
}

.logo span {
  color: white;
}

.hero {
  text-align: center;
  padding: 45px 15px 25px;
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.hero p {
  color: #929bb0;
}

input {
  background: #171c2b;
  border: 1px solid #343c52;
  color: white;
  padding: 14px;
  width: 85%;
  max-width: 450px;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 30px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}

.game {
  background: #151a29;
  border: 1px solid #292f42;
  border-radius: 15px;
  padding: 22px;
  cursor: pointer;
  transition: .2s;
}

.game:hover {
  transform: translateY(-5px);
  border-color: #8b5cf6;
  background: #20263a;
}

.emoji {
  font-size: 45px;
}

.game h3 {
  margin-bottom: 7px;
}

.game p {
  color: #929bb0;
  font-size: 13px;
}

button {
  background: #8b5cf6;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #7041df;
}

#playArea {
  display: none;
  text-align: center;
  background: #151a29;
  border: 1px solid #343c52;
  border-radius: 15px;
  padding: 25px;
  margin-top: 25px;
}

#playArea button {
  margin: 5px;
}

#gameContent {
  margin-top: 20px;
  min-height: 150px;
}

.big {
  font-size: 35px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 35px;
  color: #606a80;
}
</style>
</head>

<body>

<header>
  <div class="logo">VOID<span>GAMES</span></div>
  <div>🎮 GAME HUB</div>
</header>

<section class="hero">
  <h1>ENTER THE VOID.</h1>
  <p>Your mini gaming universe.</p>
  <br>
  <input
    id="search"
    placeholder="🔍 Search games..."
    oninput="searchGames()"
  >
</section>

<div class="container">

<h2>🔥 Featured Games</h2>

<div class="games" id="games">

  <div class="game" data-name="clicker" onclick="startGame('clicker')">
    <div class="emoji">🖱️</div>
    <h3>Clicker</h3>
    <p>Click as fast as you can!</p>
  </div>

  <div class="game" data-name="guess number" onclick="startGame('guess')">
    <div class="emoji">🔢</div>
    <h3>Number Guess</h3>
    <p>Find the secret number.</p>
  </div>

  <div class="game" data-name="tic tac toe" onclick="startGame('tic')">
    <div class="emoji">❌</div>
    <h3>Tic-Tac-Toe</h3>
    <p>Challenge yourself!</p>
  </div>

  <div class="game" data-name="reaction test" onclick="startGame('reaction')">
    <div class="emoji">⚡</div>
    <h3>Reaction Test</h3>
    <p>Test your reaction speed.</p>
  </div>

</div>

<div id="playArea">
  <h2 id="gameTitle">Game</h2>
  <button onclick="closeGame()">✖ CLOSE GAME</button>
  <div id="gameContent"></div>
</div>

</div>

<footer>
  VOID GAMES © 2026 · Made for gamers
</footer>

<script>
let clicks = 0;
let secret = 0;
let board = ["","","","","","","","",""];
let turn = "X";
let reactionTimer;
let reactionStart;
let reactionReady = false;

function searchGames() {
  let value = document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".game").forEach(game => {
    game.style.display =
      game.dataset.name.includes(value) ? "" : "none";
  });
}

function startGame(game) {
  const area = document.getElementById("playArea");
  const content = document.getElementById("gameContent");

  area.style.display = "block";
  area.scrollIntoView({behavior:"smooth"});

  if (game === "clicker") {
    clicks = 0;
    document.getElementById("gameTitle").innerText = "🖱️ CLICKER";

    content.innerHTML = `
      <p>Click the button to earn points!</p>
      <div class="big" id="score">0</div>
      <button onclick="addClick()">CLICK ME!</button>
      <button onclick="clicks=0;updateScore()">RESET</button>
    `;
  }

  if (game === "guess") {
    secret = Math.floor(Math.random()*100)+1;
    document.getElementById("gameTitle").innerText = "🔢 NUMBER GUESS";

    content.innerHTML = `
      <p>Guess a number between 1 and 100.</p>
      <input id="guessInput" type="number" placeholder="Your guess">
      <br><br>
      <button onclick="checkGuess()">GUESS</button>
      <p id="guessMessage">Good luck!</p>
    `;
  }

  if (game === "tic") {
    board = ["","","","","","","","",""];
    turn = "X";
    document.getElementById("gameTitle").innerText = "❌ TIC-TAC-TOE";
    renderTic();
  }

  if (game === "reaction") {
    document.getElementById("gameTitle").innerText = "⚡ REACTION TEST";
    reactionReady = false;

    content.innerHTML = `
      <p>Wait for the green button, then click!</p>
      <button id="reactionButton" onclick="reactionClick()">
        START
      </button>
      <p id="reactionMessage"></p>
    `;
  }
}

function addClick() {
  clicks++;
  updateScore();
}

function updateScore() {
  document.getElementById("score").innerText = clicks;
}

function checkGuess() {
  let guess = Number(document.getElementById("guessInput").value);
  let message = document.getElementById("guessMessage");

  if (!guess || guess < 1 || guess > 100) {
    message.innerText = "Enter a number from 1 to 100!";
  } else if (guess === secret) {
    message.innerText = "🎉 YOU GOT IT!";
  } else if (guess < secret) {
    message.innerText = "Too low! Try again.";
  } else {
    message.innerText = "Too high! Try again.";
  }
}

function renderTic() {
  let content = document.getElementById("gameContent");

  content.innerHTML = `
    <p>Turn: ${turn}</p>
    <div style="
      display:grid;
      grid-template-columns:repeat(3,70px);
      gap:5px;
      justify-content:center;
    ">
      ${board.map((v,i)=>`
        <button
          style="height:70px;font-size:25px"
          onclick="ticMove(${i})"
        >${v}</button>
      `).join("")}
    </div>
    <p id="ticMessage"></p>
    <button onclick="startGame('tic')">RESTART</button>
  `;
}

function ticMove(i) {
  if (board[i] || checkWinner()) return;

  board[i] = turn;

  if (checkWinner()) {
    renderTic();
    document.getElementById("ticMessage").innerText =
      turn + " WINS! 🎉";
    return;
  }

  if (board.every(v=>v!=="")) {
    renderTic();
    document.getElementById("ticMessage").innerText = "DRAW!";
    return;
  }

  turn = turn === "X" ? "O" : "X";
  renderTic();
}

function checkWinner() {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return wins.some(([a,b,c]) =>
    board[a] && board[a]===board[b] && board[b]===board[c]
  );
}

function reactionClick() {
  const button = document.getElementById("reactionButton");
  const message = document.getElementById("reactionMessage");

  if (reactionReady) {
    clearTimeout(reactionTimer);
    let time = Date.now() - reactionStart;
    message.innerText = "Your reaction: " + time + " ms!";
    button.innerText = "PLAY AGAIN";
    button.style.background = "#8b5cf6";
    reactionReady = false;
    return;
  }

  clearTimeout(reactionTimer);
  reactionReady = false;

  button.innerText = "WAIT...";
  button.style.background = "#b45309";
  message.innerText = "";

  reactionTimer = setTimeout(() => {
    button.innerText = "CLICK NOW!";
    button.style.background = "#16a34a";
    reactionStart = Date.now();
    reactionReady = true;
  }, 1500 + Math.random()*3000);
}

function closeGame() {
  document.getElementById("playArea").style.display = "none";
  clearTimeout(reactionTimer);
  reactionReady = false;
}
</script>

</body>
</html>
